[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-workflow-lab"
version = "0.1.0"
description = "PostgreSQL documentation and sandbox Agentic RAG research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
database = [
    "psycopg[binary]==3.3.8",
]
migrations = [
    "alembic==1.20.1",
    "SQLAlchemy==2.1.8",
]
embeddings = [
    "sentence-transformers==5.3.0",
    "transformers==5.5.0",
    "torch==2.10.0",
    "tokenizers==0.22.2",
]

[project.scripts]
rag-workflow-lab = "rag_workflow_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_workflow_lab = ["prompts/*.md"]
