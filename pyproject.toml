[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-workflow-lab"
version = "0.1.0"
description = "PostgreSQL documentation and sandbox Agentic RAG research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rag-workflow-lab = "rag_workflow_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_workflow_lab = ["prompts/*.md"]
